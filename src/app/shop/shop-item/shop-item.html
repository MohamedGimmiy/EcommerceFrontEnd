  <div class="card h-100" style="cursor: pointer;">
    <a routerLink="/shop/product-details/{{Product.id}}">
      <img
        src="https://localhost:44338/{{Product.photos[0].imageName}}"
        class="card-img-top"
        alt=""
      />
    </a>
    <div class="card-body">
      <div class="thumbnails mb-3">
        @for (item of Product.photos; track $index) {
            <img
              src="https://localhost:44338/{{item.imageName}}"
              alt=""
              class="thumbnail-img small-img"
            />
        }
        <img
          src="https://png.pngtree.com/png-vector/20250304/ourmid/pngtree-sleek-modern-laptop-with-high-resolution-display-png-image_15711292.png"
          alt=""
          class="thumbnail-img small-img"
        />
        <img
          src="https://png.pngtree.com/png-vector/20250304/ourmid/pngtree-sleek-modern-laptop-with-high-resolution-display-png-image_15711292.png"
          alt=""
          class="thumbnail-img small-img"
        />
      </div>
      <h5 class="card-title"><a routerLink="/shop/product-details/{{Product.id}}" class="text-decoration-none">{{Product.name}}</a></h5>
      <p class="card-text">
        {{Product.description}}
      </p>
      <p class="price">
        <span class="old-price">{{ Product.oldPrice| currency }}</span>
        {{ Product.newPrice| currency }}
      </p>
      <div class="rating mb-3"></div>
      <button class="btn btn-outline-primary favorite-icon">
        <i class="fa fa-bookmark"></i>
      </button>
      <div class="d-flex justify-content-between align-items-start mt-3">
        <button class="btn btn-dark" (click)="SetBasketValue()">
          <i class="fa fa-shopping-cart"></i> Add to cart
        </button>
        <button routerLink="/shop/product-details/{{Product.id}}" class="btn btn-success">
          <i class="fa fa-info-circle"></i> Details
        </button>
      </div>
    </div>
  </div>
